[project]
name = "file-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rajeshrc12", email = "rajesh.charhajari@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.89",
    "celery>=5.6.3",
    "langchain-aws>=1.7.5",
    "langchain-community>=0.4.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.17.0",
    "qdrant-client>=1.19.0",
    "redis>=8.1.0",
]

[project.scripts]
file-service = "file_service:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
