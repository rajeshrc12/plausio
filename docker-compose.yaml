services:
  postgres:
    image: postgres:17
    container_name: plausio-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: plausio
      POSTGRES_USER: plausio
      POSTGRES_PASSWORD: plausio

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plausio -d plausio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: plausio-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
