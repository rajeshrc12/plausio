services:
  postgres:
    image: postgres:17
    container_name: plausio-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: plausio
      POSTGRES_USER: plausio
      POSTGRES_PASSWORD: plausio

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plausio -d plausio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
