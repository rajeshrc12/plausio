    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "google-auth>=2.57.1",
    "langchain-aws>=1.7.5",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.11",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "qdrant-client>=1.19.0",
